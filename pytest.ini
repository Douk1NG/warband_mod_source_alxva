[pytest]
# Run from repo root with `python -m pytest` or `pytest`
# Don't auto-discover tests inside source/ — those are module-system .py files,
# not pytest tests. Tests live in tests/.
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers
# Markers (use them with `-m <marker>` to select)
markers =
    bandit: tests covering the bandit spawn / lair system
    invariants: tests that validate cross-module references and slot ranges
    performance: static-analysis tests for world-map lag patterns